<!DOCTYPE html>
<html lang="id" data-sh="pixel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft Server Developer</title>
<link id="fav" rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--p:#5dd6c4;--s:#e8a33d;--bg:#14161a;--card:#1d2026;--tx:#e6e8eb;--mu:#8d96a0;--bd:#343a43;--r:0px;--fh:'Press Start 2P';--fb:Inter}
.light{--bg:#eef0f2;--card:#fff;--tx:#1b1f24;--mu:#5b6570;--bd:#c9d0d8}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--fb),sans-serif}
.px{font-family:var(--fh),monospace;line-height:1.6}
.mono{font-family:'JetBrains Mono',monospace}
.card,.btn,.btn2,.chip,.inp{border-radius:var(--r)}
.card{background:var(--card);border:2px solid var(--bd);box-shadow:4px 4px 0 var(--bd)}
.card:hover{border-color:var(--p);box-shadow:4px 4px 0 var(--p)}
[data-sh=soft] .card{box-shadow:0 8px 24px rgba(0,0,0,.3)}
[data-sh=none] .card,[data-sh=none] .btn{box-shadow:none}
.btn{background:var(--p);color:#000;padding:.7rem 1.3rem;font-weight:600;border:2px solid #000;box-shadow:4px 4px 0 var(--s)}
.btn:active{transform:translate(2px,2px)}
.btn2{border:2px solid var(--s);color:var(--s);padding:.7rem 1.3rem;font-weight:600}
.chip{border:2px solid var(--bd);padding:.4rem .9rem;font-size:.85rem}
.chip.on{background:var(--p);color:#000;border-color:var(--p)}
.inp{width:100%;background:var(--bg);border:2px solid var(--bd);padding:.5rem;color:var(--tx)}
.bar{height:10px;background:var(--bd)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--s))}
#hero{background-size:cover;background-position:center}
nav{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:2px solid var(--bd)}
:focus-visible{outline:3px solid var(--s);outline-offset:2px}
</style>
<style id="customCss"></style>
</head>
<body>
<nav class="px-6 py-3 flex items-center justify-between gap-4">
  <a href="#" id="brand" class="px text-xs"></a>
  <div id="navLinks" class="flex gap-5 text-sm"></div>
</nav>

<header id="hero" class="min-h-[85vh] flex items-center px-6 py-12">
  <div id="heroWrap" class="max-w-3xl mx-auto w-full">
    <div id="badge" class="flex flex-wrap gap-3 mb-6"></div>
    <h1 id="heroTitle" class="px text-2xl md:text-4xl mb-6" style="color:var(--p)"></h1>
    <p id="heroSub" class="text-lg mb-6" style="color:var(--mu)"></p>
    <div class="card mono text-sm p-4 mb-6 text-left">
      <div style="color:var(--mu)">[Server thread/INFO]: about.txt</div>
      <div><span style="color:var(--s)">&lt;Dev&gt;</span> <span id="bio"></span></div>
    </div>
    <div id="heroIp" class="flex flex-wrap gap-3 items-center mb-6"></div>
    <div id="heroBtns" class="flex flex-wrap gap-4">
      <a id="cta1" href="#projects" class="btn"></a>
      <a id="cta2" href="#contact" class="btn2"></a>
    </div>
    <div id="stats" class="flex flex-wrap gap-8 mt-10"></div>
  </div>
</header>

<section id="skills" class="max-w-6xl mx-auto px-6 py-16">
  <h2 id="skillsT" class="px text-lg mb-8" style="color:var(--s)"></h2>
  <div id="skillGrid" class="grid grid-cols-2 md:grid-cols-4 gap-5"></div>
</section>

<section id="projects" class="max-w-6xl mx-auto px-6 py-16">
  <h2 id="projectsT" class="px text-lg mb-6" style="color:var(--s)"></h2>
  <input id="q" type="search" placeholder="Cari proyek atau tag…" class="inp mb-4 max-w-sm">
  <div id="filters" class="flex flex-wrap gap-2 mb-8"></div>
  <div id="projGrid" class="grid gap-6"></div>
</section>

<section id="contact" class="max-w-6xl mx-auto px-6 py-16">
  <h2 id="contactT" class="px text-lg mb-6" style="color:var(--s)"></h2>
  <div id="contactLinks" class="flex flex-wrap gap-4"></div>
</section>
<footer id="footerText" class="text-center text-sm py-8" style="color:var(--mu)"></footer>

<button id="adminBtn" aria-label="Admin login" class="card fixed bottom-4 right-4 w-12 h-12 z-40"><i class="fa-solid fa-lock"></i></button>
<div id="modal" class="hidden fixed inset-0 z-50 overflow-y-auto p-4" style="background:rgba(0,0,0,.75)">
  <div id="modalBody" class="card max-w-3xl mx-auto p-6 mt-6"></div>
</div>
<div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 font-semibold text-black"></div>
<script src="script.js"></script>
</body>
</html>
